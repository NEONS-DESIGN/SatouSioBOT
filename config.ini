[MusicBot]
# 初期音量（0.0～2.0の範囲で指定）
default_volume = 0.25
# キューの最大数（曲の追加制限）
default_queue_limit = 50
# プレイリストの最大数（ユーザーごとの保存制限）
default_playlist_limit = 10
# 曲を取得する際の最大試行回数
max_retries = 3
# ワーカーの最大同時実行数（曲の処理に使用するスレッド数）
max_worker_threads = 4
# キャッシュの有効期限(秒単位)（大体6時間が限度です。 例: 14400は4時間）
cache_ttl = 14400
# yt-dlp に渡す User-Agent（空欄なら yt-dlp 既定の最新ブラウザ UA を使用。通常は空欄推奨）
user_agent =
# SQLiteデータベースのファイルパス
database_path = data.db